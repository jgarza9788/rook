<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rook: a geometric chess rook. Flat shapes, hairline gaps between the
       parts instead of outlines, so it reads in one colour at any size. -->
  <rect width="128" height="128" rx="24" fill="#101010"/>
  <g fill="#f5f1e8">
    <!-- crown: three merlons -->
    <path d="M34 22 H52 V34 H60 V22 H68 V34 H76 V22 H94 V46 H34 Z"/>
    <!-- collar -->
    <path d="M37 50 H91 L86 58 H42 Z"/>
    <!-- body -->
    <rect x="46" y="62" width="36" height="22"/>
    <!-- plinth and foot -->
    <path d="M42 88 H86 L92 96 H36 Z"/>
    <rect x="30" y="100" width="68" height="8" rx="2"/>
  </g>
</svg>
